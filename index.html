<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tifelabs</title>
<link rel="icon" href="./assets/images/baby.png">
<style>
:root{--bg:#f2ede4;--ink:#1c1917;--accent:#2d6a4f;--muted:#4a4540}
*{margin:0;padding:0;box-sizing:border-box}
body{font:15px/1.7 Georgia,serif;color:var(--ink);background:var(--bg);max-width:620px;margin:0 auto;padding:32px 24px 80px}

nav{display:flex;gap:22px;margin-bottom:32px}
nav a{font:12px ui-monospace,Menlo,monospace;color:var(--accent);text-decoration:none}
nav a:hover{text-decoration:underline;text-underline-offset:3px}

.banner{display:block;width:100%;height:60px;object-fit:cover;object-position:center 38%;margin-bottom:40px;border-radius:2px}
h1{font:300 26px/1.2 Georgia,serif;margin-bottom:12px}
.intro{color:var(--muted);margin-bottom:56px}

.block{display:flex;gap:24px;margin-bottom:48px}
.block.reverse{flex-direction:row-reverse}
.block img{width:160px;flex-shrink:0;border:1px solid var(--accent)}
.block p{font:300 14px/1.7 Georgia,serif;color:var(--muted)}
.hl{color:var(--accent);font-style:italic}

.lightbox{display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;padding:40px;background:rgba(28,25,23,.92);cursor:pointer}
.lightbox:target{display:flex}
.lightbox img{max-width:100%;max-height:100%;border:1px solid var(--accent)}

footer{font:12px/2 ui-monospace,Menlo,monospace;color:var(--accent);margin-top:64px}
footer a{color:inherit;text-decoration:none}
footer a:hover{text-decoration:underline}

@media(max-width:520px){
.block,.block.reverse{flex-direction:column}
.block img{width:100%;max-width:280px}
}
</style>
</head>
<body>

<nav>
<a href="./photography/">/photography</a>
<a href="./blogs/">/writing</a>
<a href="./resource/">/resources</a>
</nav>

<img class="banner" src="./assets/images/crabapple.webp" alt="Crabapple">

<h1>Tife</h1>
<p class="intro">I love computers. I do programming and hobby photography.</p>

<div class="block">
<a href="#lb1"><img src="./assets/images/american_eagle.webp" alt="CRJ-700"></a>
<p>American Eagle Bombardier <span class="hl">CRJ-700</span> at <span class="hl">Pearson International Airport</span>.</p>
</div>

<div class="block reverse">
<a href="#lb2"><img src="./assets/images/banff.webp" alt="Banff"></a>
<p>One of my favourite shots from <span class="hl">Banff</span>, mountain photography at high altitude.</p>
</div>

<a href="#" id="lb1" class="lightbox"><img src="./assets/images/american_eagle.webp" alt="CRJ-700"></a>
<a href="#" id="lb2" class="lightbox"><img src="./assets/images/banff.webp" alt="Banff"></a>

<footer>
alberta, ca<br>
<a href="mailto:tifelabs@gmail.com">tifelabs@gmail.com</a><br>
<a href="https://github.com/tifelabs" target="_blank">github</a>
</footer>

</body>
</html>
